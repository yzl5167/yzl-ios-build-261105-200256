<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>YZL Launcher iOS · 横屏设计预览</title>
<style>
  :root{
    --page:#F4F6FB; --card:#FFFFFF; --field:#F8FAFD;
    --text:#252F44; --muted:#7C8AA0; --light:#A2AEC0; --border:#E4E9F2;
    --accent:#3B82F6; --accent-text:#1D4C9E; --accent-soft:#EAF2FF;
    --success:#22C55E; --success-soft:#E9F9EF; --danger:#EF4444;
    --warning-soft:#FFF4E5; --warning-text:#B26A00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--text)}
  #stage{width:960px;height:432px;transform:scale(2.5);transform-origin:top left;position:relative;overflow:hidden}
  .screen{width:960px;height:432px;display:flex;background:var(--page);overflow:hidden;position:relative}
  .rail{width:84px;flex:none;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px}
  .brand{width:42px;height:42px;border-radius:11px;display:block}
  .brandname{font-size:10px;color:var(--muted);margin-top:5px}
  .navs{display:flex;flex-direction:column;gap:4px;margin-top:16px;width:100%;align-items:center}
  .navitem{width:64px;padding:5px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
  .navitem.active{background:var(--accent-soft);color:var(--accent)}
  .navitem span{font-size:10px;font-weight:500}
  .railspacer{flex:1}
  .railavatar{width:64px;padding:5px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
  .railavatar.active{background:var(--accent-soft)}
  .railavatar .cap{font-size:9.5px;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .content{flex:1;min-width:0;position:relative;overflow:hidden}

  .pixelhead{image-rendering:pixelated;border-radius:9px;border:1px solid var(--border);background:#D5DCE8}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;border-radius:10px}
  .btn.primary{background:var(--accent);color:#fff;height:52px;font-size:17px;width:100%;box-shadow:0 6px 14px rgba(59,130,246,.22)}
  .btn.soft{background:#fff;border:1px solid var(--border);color:var(--accent-text);height:40px;font-size:13px;width:100%}
  .btn.pill{background:var(--accent-soft);color:var(--accent-text);font-size:13px;padding:0 16px;height:38px;border-radius:9px}
  .btn.danger{background:#FEECEC;color:var(--danger);border:1px solid rgba(239,68,68,.35);height:42px;font-size:13px;padding:0 16px}
  .badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;background:var(--field);color:var(--muted);white-space:nowrap}
  .badge.success{background:var(--success-soft);color:#17934A}
  .badge.accent{background:var(--accent-soft);color:var(--accent-text)}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(23,43,77,.045)}

  /* home */
  .home{height:100%;background:#fff;display:flex;justify-content:center;overflow:hidden}
  .homecol{width:420px;display:flex;flex-direction:column;align-items:center;padding-top:12px}
  .home .name{font-size:22px;font-weight:700;margin-top:10px}
  .home .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
  .vrow{width:100%;height:44px;margin-top:13px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:9px;padding:0 14px;background:#fff}
  .vrow img{width:30px;height:30px;image-rendering:pixelated}
  .vrow .lb{font-size:12px;color:var(--muted)}
  .vrow .vv{font-size:14px;font-weight:600}
  .vrow .chev{margin-left:auto;color:var(--light)}
  .home .launch{margin-top:11px;width:100%}
  .home .two{margin-top:10px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pills{display:flex;gap:7px;margin-top:12px}
  .pills div{font-size:9.5px;color:var(--muted);background:var(--field);border-radius:999px;padding:5px 9px}
  .pills b{font-weight:500;color:var(--light)}

  /* page header */
  .pagehead{height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px 0 24px}
  .pagehead .tt{font-size:24px;font-weight:700;line-height:1.1}
  .pagehead .st{font-size:10.5px;color:var(--muted);margin-top:3px}
  .pagehead .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .backbtn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .pagebody{flex:1;min-height:0;overflow:hidden}

  /* account */
  .accountwrap{max-width:880px;margin:0 auto;padding:0 24px}
  .acctcard{padding:16px}
  .accttop{display:flex;align-items:center;gap:14px}
  .acctname{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px}
  .acctmeta{display:flex;align-items:center;gap:8px;margin-top:5px}
  .kind{font-size:10.5px;font-weight:500;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:3px 8px}
  .uuid{font-size:10.5px;color:var(--light);font-family:ui-monospace,Consolas,monospace}
  .acctuse{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .using{flex:1;height:42px;border-radius:8px;background:var(--success-soft);color:var(--success);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  .privacy{margin-top:14px;padding:14px 16px;font-size:11px;color:var(--muted);line-height:1.6}
  .empty{padding:22px;display:flex;align-items:center;gap:18px}
  .empty .circle{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:rgba(59,130,246,.6)}
  .empty .t{font-size:19px;font-weight:700}
  .empty .d{font-size:11px;color:var(--muted);margin-top:5px}
  .empty .btn{margin-left:auto;width:150px;height:42px;background:var(--accent);color:#fff;font-size:13px;border-radius:9px}

  /* versions */
  .vsplit{display:flex;height:100%;min-height:0}
  .vleft{width:350px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .filter{height:38px;flex:none;display:flex;align-items:center;padding:0 16px;font-size:11px;color:var(--muted)}
  .seg{margin-left:auto;width:124px;height:26px;background:#EDF1F7;border-radius:8px;padding:2px;display:flex}
  .seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-radius:6px}
  .seg .on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(23,43,77,.12)}
  .vlist{flex:1;min-height:0;padding:0 12px}
  .group{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .vrow2{height:47px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #EEF1F6}
  .vrow2:last-child{border-bottom:none}
  .vrow2.sel{background:var(--accent-soft)}
  .vrow2 img{width:29px;height:29px;image-rendering:pixelated}
  .vrow2 .name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .vrow2.sel .name{color:var(--accent-text)}
  .vrow2 .sub{font-size:10px;color:var(--muted);margin-top:3px}
  .vrow2 .chev{margin-left:auto;color:var(--light)}
  .vdetail{flex:1;min-width:0;padding:0 20px;overflow:hidden}
  .vdhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .vdhead img{width:42px;height:42px;image-rendering:pixelated}
  .vdhead .name{font-size:20px;font-weight:700}
  .vdhead .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
  .vdgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cardpad{padding:13px 14px}
  .ctitle{font-size:13px;font-weight:600;margin-bottom:7px}
  .ptext{font-size:10.5px;color:var(--muted);line-height:1.6}
  .irow{display:flex;justify-content:space-between;font-size:11px;padding:4px 0}
  .irow .k{color:var(--muted)}
  .progress{height:6px;background:#E8EEF7;border-radius:3px;overflow:hidden;margin:6px 0}
  .progress i{display:block;height:100%;width:43%;background:var(--accent);border-radius:3px}

  /* settings */
  .settingsbody{max-width:880px;margin:0 auto;padding:0 24px 18px;overflow:hidden}
  .scard{margin-bottom:12px;padding:14px 16px}
  .scard h3{font-size:15px;font-weight:600;margin-bottom:10px}
  .field{height:40px;border-radius:9px;background:var(--field);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:11px;font-family:ui-monospace,Consolas,monospace;color:var(--text)}
  .hint{font-size:9.5px;color:var(--muted);line-height:1.55;margin-top:8px}
  .row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0}
  .row .v{color:var(--muted)}
  .slider{height:18px;display:flex;align-items:center;margin:4px 0 2px}
  .track{position:relative;width:100%;height:4px;border-radius:2px;background:#E4E9F2}
  .track i{position:absolute;left:0;top:0;height:4px;width:42%;background:var(--accent);border-radius:2px}
  .track b{position:absolute;left:42%;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(23,43,77,.25)}

  /* about */
  .aboutbody{max-width:880px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .aboutcard{padding:14px 16px}
  .aboutcard h3{font-size:13px;font-weight:600;margin-bottom:7px}
  .milestone{display:flex;gap:7px;font-size:10.5px;color:var(--muted);margin-top:6px}
  .milestone.done{color:var(--text)}
  .abouttext{font-size:10.5px;color:var(--muted);line-height:1.65}

  /* launch sheet */
  .sheetback{position:absolute;inset:0;background:rgba(18,28,46,.38);display:flex;align-items:center;justify-content:center;z-index:20}
  .sheet{width:640px;max-height:424px;background:var(--page);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(15,23,42,.32);border:1px solid rgba(255,255,255,.7)}
  .sheethead{height:48px;flex:none;display:flex;align-items:center;padding:0 20px;gap:10px}
  .sheethead .tt{font-size:19px;font-weight:700}
  .sheethead .st{font-size:10px;color:var(--muted);margin-top:2px}
  .sheetbody{flex:1;min-height:0;overflow:hidden;padding:0 20px;display:grid;grid-template-columns:1fr 1.15fr;gap:12px}
  .sheetfoot{height:46px;flex:none;display:flex;gap:9px;align-items:center;padding:0 20px;border-top:1px solid var(--border);background:rgba(255,255,255,.55)}
  .checks{padding:8px 12px}
  .checkrow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #EEF1F6;align-items:flex-start}
  .checkrow:last-child{border-bottom:none}
  .checkrow .ic{font-size:10px;font-weight:700;width:14px;text-align:center;line-height:14px;flex:none;margin-top:1px}
  .checkrow .n{font-size:10.5px;font-weight:600}
  .checkrow .d{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .checkrow.ok .ic{color:var(--success)}
  .checkrow.warn .ic{color:var(--warning-text)}
  .checkrow.fail .ic{color:var(--danger)}
  .sheetbanner{padding:9px 11px;border-radius:9px;font-size:10px;line-height:1.5;margin-top:10px;background:#FEECEC;color:#B91C1C}
  .sheetbanner b{display:block;font-size:11px;margin-bottom:2px}

  /* login */
  .login{height:100%;display:flex;flex-direction:column}  .loginhead{height:60px;flex:none;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border)}
  .loginhead .tt{font-size:20px;font-weight:700}
  .loginhead .st{font-size:10.5px;color:var(--muted);margin-top:3px}
  .closex{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);margin-left:auto}
  .loginbody{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:22px 28px;min-height:0}
  .loginbody h3{font-size:17px;font-weight:600}
  .loginbody .desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:9px}
  .url{font-size:10.5px;color:var(--accent-text);margin-top:10px;font-family:ui-monospace,Consolas,monospace}
  .codebox{background:var(--field);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:center}
  .codebox .lb{font-size:10.5px;color:var(--muted)}
  .codebox .code{font-size:34px;font-weight:700;letter-spacing:1.5px;margin-top:4px;font-family:ui-monospace,Consolas,monospace}
  .waitrow{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-top:12px}
  .spinner{width:12px;height:12px;border-radius:50%;border:2px solid #D8E2F1;border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BASE = '../../YZLLauncher/Resources/Assets.xcassets/';
const IMG = {
  brand: BASE + 'BrandIcon.imageset/BrandIcon.png',
  grass: BASE + 'GrassBlock.imageset/GrassBlock.png',
  command: BASE + 'CommandBlock.imageset/CommandBlock.png'
};

function svg(paths, size, opts={}){
  const width = opts.width || 1.8;
  return `<span style="display:inline-flex;width:${size}px;height:${size}px;flex:none">
    <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${opts.fill?'currentColor':'none'}"
      stroke="${opts.fill?'none':'currentColor'}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${paths}</svg></span>`;
}
const I = {
  gear: s => svg('<circle cx="12" cy="12" r="3.1"/><path d="M19.2 12.9a7.6 7.6 0 0 0 .05-1.6l2-1.5-2-3.5-2.3.95a7.4 7.4 0 0 0-1.4-.82L15.2 3.9h-4l-.36 2.53a7.4 7.4 0 0 0-1.4.82L7.1 6.3l-2 3.5 2 1.5a7.6 7.6 0 0 0 0 1.6l-2 1.5 2 3.5 2.34-.95c.43.33.9.6 1.4.82l.36 2.53h4l.36-2.53c.5-.22.97-.49 1.4-.82l2.34.95 2-3.5-2.1-1.6Z"/>', s),
  person: s => svg('<circle cx="12" cy="7.4" r="3.4"/><path d="M5.4 20c.5-3.5 3.2-5.7 6.6-5.7s6.1 2.2 6.6 5.7"/>', s),
  chevron: s => svg('<path d="m9 5 7 7-7 7"/>', s, {width:2}),
  back: s => svg('<path d="m15 5-7 7 7 7"/>', s, {width:2}),
  play: s => svg('<path d="M7 4.6v14.8L19.2 12 7 4.6Z"/>', s, {fill:true}),
  house: s => svg('<path d="M4 10.4 12 3.6l8 6.8V20a1 1 0 0 1-1 1h-5v-5.6H10V21H5a1 1 0 0 1-1-1v-9.6Z"/>', s, {fill:true}),
  stack: s => svg('<path d="m12 3 8 4.3-8 4.3-8-4.3L12 3Z"/><path d="m4.8 12.2 7.2 3.9 7.2-3.9"/><path d="m4.8 16.6 7.2 3.9 7.2-3.9"/>', s),
  info: s => svg('<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4"/><circle cx="12" cy="8.1" r=".5" fill="currentColor" stroke="none"/>', s),
  check: s => svg('<path d="m6.5 12.2 3.4 3.4 7.2-7.4"/>', s, {width:2.2}),
  close: s => svg('<path d="m6 6 12 12M18 6 6 18"/>', s, {width:2}),
  download: s => svg('<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/>', s, {width:2})
};

/* 本地素材：8×8 头部像素 + 64×64 完整皮肤贴图，和 App 里的做法一致，不请求任何第三方头像服务。 */
const HEAD_IMG = 'avatar/steve.png';
const SKIN_IMG = 'avatar/steve_skin64.png';
function pixelHead(size){
  return `<img src="${HEAD_IMG}" style="width:${size}px;height:${size}px;image-rendering:pixelated;border-radius:9px;border:1px solid var(--border);background:#D5DCE8">`;
}

function rail(active, signedIn){
  const items = [['home','首页',I.house],['versions','版本',I.stack],['skin','皮肤',I.person],['settings','设置',I.gear]];
  return `<div class="rail">
    <img class="brand" src="${IMG.brand}">
    <div class="brandname">YZL</div>
    <div class="navs">
      ${items.map(([id,label,ic])=>`<div class="navitem ${active===id?'active':''}">${ic(20)}<span>${label}</span></div>`).join('')}
    </div>
    <div class="railspacer"></div>
    <div class="railavatar ${active==='account'?'active':''}">
      ${signedIn ? pixelHead(38) : `<div style="width:38px;height:38px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:rgba(59,130,246,.8)">${I.person(17)}</div>`}
      <div class="cap" style="${active==='account'?'color:var(--accent-text)':''}">${signedIn?'Steve':'未登录'}</div>
    </div>
    <div class="navitem ${active==='about'?'active':''}" style="margin-top:2px">
      ${I.info(20)}<span>关于</span>
    </div>
  </div>`;
}

function tophead(title, subtitle, right=''){
  return `<div class="pagehead">
    <div><div class="tt">${title}</div><div class="st">${subtitle}</div></div>
    <div class="right">${right}</div>
  </div>`;
}

function homeScreen(signedIn, installing=false){
  const version = signedIn ? '1.21.10' : '未选择';
  const launchLabel = installing ? `${I.download(16)}下载游戏` : (signedIn ? `${I.play(16)}启动游戏` : `${I.download(16)}下载游戏`);
  const secondLabel = installing ? `${I.download(14)}下载游戏` : (signedIn ? `${I.check(14)}启动自检` : `${I.download(14)}下载游戏`);
  const versionBadge = installing
    ? '<span class="badge accent">安装中</span>'
    : (signedIn ? '<span class="badge success">已安装</span>' : '');
  const versionPill = installing ? '安装中' : (signedIn ? '已安装' : '未安装');
  const banner = installing ? `<div class="card cardpad" style="margin-top:12px;width:100%">
      <div style="display:flex;align-items:center;gap:8px"><div class="ctitle" style="margin:0">正在安装 1.21.10</div><div class="ptext" style="margin-left:auto">1,204/3,620</div></div>
      <div class="progress"><i style="width:36%"></i></div>
      <div style="display:flex;align-items:center;gap:6px"><div class="ptext">261 MB / 732 MB · 8.4 MB/s</div><div class="ptext" style="margin-left:auto;color:var(--danger);font-weight:600">取消</div></div>
    </div>` : '';
  return `<div class="content"><div class="home"><div class="homecol">
    <div style="position:relative">${signedIn ? pixelHead(120) : `<div style="width:120px;height:120px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:rgba(59,130,246,.55)">${I.person(48)}</div>`}</div>
    <div class="name">${signedIn?'Steve':'未登录'}</div>
    <div class="sub">${signedIn?'微软正版账号':'微软账户 · 点击头像登录'}</div>
    <div class="vrow">
      <img src="${IMG.grass}">
      <span class="lb">当前版本</span><span class="vv">${version}</span>
      ${versionBadge}
      <span class="chev">${I.chevron(11)}</span>
    </div>
    <div class="launch"><div class="btn primary">${launchLabel}</div></div>
    <div class="two"><div class="btn soft">${I.stack(13)}版本管理</div><div class="btn soft">${secondLabel}</div></div>
    ${banner}
    <div class="pills"><div><b>版本</b> ${versionPill}</div><div><b>JIT</b> 未知</div><div><b>Java</b> 未安装</div><div><b>引擎</b> 未接入</div></div>
  </div></div></div>`;
}

function accountScreen(signedIn){
  const header = tophead('账号管理','微软正版账号 · 设备码登录',
    signedIn ? '<div class="btn danger">退出登录</div>' : '<div class="btn pill">登录账号</div>');
  const body = signedIn ? `
    <div class="accountwrap">
      <div class="card acctcard">
        <div class="accttop">
          ${pixelHead(58)}
          <div>
            <div class="acctname">Steve <span class="badge success">当前</span></div>
            <div class="acctmeta"><span class="kind">微软正版账号</span><span class="uuid">069a79f4-44e9…</span></div>
          </div>
        </div>
        <div class="acctuse">
